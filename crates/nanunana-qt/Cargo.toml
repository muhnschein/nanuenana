[package]
name = "nanunana-qt"
description = "Qt/QML glue for Nanünana: the App object and the C++ start-up code"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"
links = "nanunana_qt_glue"

[features]
sailfish = []

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "deny", priority = -1 }

[dependencies]
nanunana-core = { path = "../nanunana-core" }
qmetaobject = { version = "0.2.10", default-features = false, features = ["log"] }
qttypes = { version = "0.2", default-features = false, features = ["qtquick"] }
cpp = "0.5"
log = "0.4"
serde = "1"
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
cpp_build = "0.5"
