<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Covers</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./silica.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div class="amb {{amb}}" style="width: 780px; height: 440px; display: flex; gap: 30px; align-items: center; justify-content: center">

  <div class="cover l3">
    <span class="lv big l3" role="img" aria-label="Level 3 of 4"><i></i><i></i><i></i><i></i></span>
    <div class="lvw" style="font-size: 26px; font-weight: 300; line-height: 1.1">Danger</div>
    <div style="font-size: 17px">München</div>
    <div class="small sec" style="line-height: 1.3">Rauchentwicklung durch Großbrand</div>
    <div class="xs sec" style="margin-top: 6px">+ 3 more in 2 places</div>
    <div class="cover-a"><svg class="ic" viewBox="0 0 24 24" role="img" aria-label="Update now"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg></div>
  </div>

  <div class="cover">
    <span class="lv big" role="img" aria-label="No level"><i></i><i></i><i></i><i></i></span>
    <div class="hl" style="font-size: 26px; font-weight: 300; line-height: 1.1">No warnings</div>
    <div style="font-size: 17px">4 places</div>
    <div class="small sec">Checked 14:32</div>
    <div class="cover-a"><svg class="ic" viewBox="0 0 24 24" role="img" aria-label="Update now"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg></div>
  </div>

  <div class="cover">
    <svg class="ic m err" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l10 18H2zM12 10v5M12 18h.01"/></svg>
    <div class="err" style="font-size: 26px; font-weight: 300; line-height: 1.1">Not updated</div>
    <div style="font-size: 17px">since 13:05</div>
    <div class="small sec" style="line-height: 1.3">Warnings may be missing</div>
    <div class="cover-a"><svg class="ic" viewBox="0 0 24 24" role="img" aria-label="Update now"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg></div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"ambience":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":780,"height":440}}'>
class Component extends DCLogic {
renderVals() {
return { amb: (this.props.ambience ?? 'dark') === 'light' ? 'light' : 'dark' };
}
}
</script>
</body>
</html>
