<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Places: none yet</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./silica.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div class="amb {{amb}}" style="width: 400px; height: 860px">
  <div class="pull-ind"></div>
  <div class="hdr">
    <div class="hdr-t">Places</div>
  </div>

  <div class="ph" style="top: 300px">
    <div class="ph-t">No places yet</div>
    <div class="ph-h">Pull down to add a place. Warnings at your current location can be turned on in Settings. Without either you get no alerts.</div>
  </div>

  <div class="unoff bottom">Unofficial app. In an emergency follow sirens, cell broadcast, radio and the authorities.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"ambience":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
renderVals() {
return { amb: (this.props.ambience ?? 'dark') === 'light' ? 'light' : 'dark' };
}
}
</script>
</body>
</html>
