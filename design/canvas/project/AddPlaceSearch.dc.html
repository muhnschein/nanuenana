<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add place: search</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./silica.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div class="amb {{amb}}" style="width: 400px; height: 860px">
  <div class="ind-back"><i></i><i></i></div>
  <div class="hdr">
    <div class="hdr-t">Add place</div>
  </div>

  <div class="tf" style="display: flex; gap: 12px; align-items: flex-start">
    <svg class="ic hl" viewBox="0 0 24 24" aria-hidden="true" style="margin-top: 8px"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
    <div style="flex: 1">
      <input id="q" type="text" value="Rehl">
      <label for="q">Town, village or postcode</label>
    </div>
  </div>

  <button class="li">
    <div class="li-b">
      <div class="li-t"><span class="hl">Rehl</span>ingen-Siersburg</div>
      <div class="li-s">Landkreis Saarlouis, Saarland</div>
    </div>
    <div class="li-r">66780</div>
  </button>
  <button class="li">
    <div class="li-b">
      <div class="li-t"><span class="hl">Rehl</span>ing</div>
      <div class="li-s">Landkreis Aichach-Friedberg, Bayern</div>
    </div>
    <div class="li-r">86508</div>
  </button>
  <button class="li">
    <div class="li-b">
      <div class="li-t"><span class="hl">Rehl</span>ingen</div>
      <div class="li-s">Landkreis Lüneburg, Niedersachsen</div>
    </div>
    <div class="li-r">21385</div>
  </button>

  <div class="unoff bottom">The place list is on your phone: what you type is not sent anywhere. Germany only for now.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"ambience":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
renderVals() {
return { amb: (this.props.ambience ?? 'dark') === 'light' ? 'light' : 'dark' };
}
}
</script>
</body>
</html>
